---
services:
  detector:
    image: demsking/oremi-ohunerin
    ports:
      - 45023:5023

  listener:
    tty: true
    build: .
    image: demsking/oremi-ohunerin-listener:test
    devices:
      - /dev/snd:/dev/snd # Mount the microphone device
    volumes:
      - $XDG_RUNTIME_DIR/pulse/native:/var/config/pulse/native
      - ~/.config/pulse/cookie:/var/config/pulse/cookie
    env_file:
      - .env
    # command: --list-devices
    command: listen --host detector --mqtt-broker 192.168.1.93 --mqtt-port 11883
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: poetry.lock
        - action: sync+restart
          path: ohunerin
          target: /opt/oremi/ohunerin
        - action: sync+restart
          path: bin/
          target: /opt/oremi/bin
        - action: sync+restart
          path: scripts/pulse-client.conf
          target: /etc/pulse/client.conf
