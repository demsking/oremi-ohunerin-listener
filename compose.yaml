---
services:
  detector:
    image: demsking/oremi-ohunerin
    ports:
      - 45023:5023

  listener:
    tty: true
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: demsking/oremi-ohunerin-listener:test
    depends_on:
      - detector
      - mosquitto
    devices:
      - /dev/snd:/dev/snd # Mount the microphone device
    volumes:
      - $XDG_RUNTIME_DIR/pulse/native:/var/config/pulse/native
      - ~/.config/pulse/cookie:/var/config/pulse/cookie
    env_file:
      - .env
    # command: --list-devices
    command: listen --host detector --mqtt-broker mosquitto --mqtt-port 1883 --threshold 0.1
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: poetry.lock
        - action: sync+restart
          path: ohunerin
          target: /opt/oremi/ohunerin
        - action: sync+restart
          path: bin/
          target: /opt/oremi/bin
        - action: sync+restart
          path: scripts/pulse-client.conf
          target: /etc/pulse/client.conf

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    ports:
      - 41883:1883
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
