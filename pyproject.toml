[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oremi-ohunerin-listener"
version = "3.0.0b1"
description = "Oremi Ohunerin Listener bridges Oremi Ohunerin's real-time audio detection with MQTT, enabling seamless integration into home automation systems like Home Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sébastien Demanou", email = "demsking@gmail.com" }
]
keywords = ["ohunerin", "listener", "sound", "detection", "wakeword", "mqtt"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: French",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "oremi-core>=1.2.1,<2.0.0",
  "websockets>=14.1,<15.0",
  "sounddevice>=0.5.1,<0.6.0",
  "paho-mqtt>=2.1.0,<3.0.0",
  "dataclasses-json>=0.6.7,<0.7.0",
]

[project.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Source" = "https://gitlab.com/demsking/oremi-ohunerin-listener"
"Tracker" = "https://gitlab.com/demsking/oremi-ohunerin-listener/-/issues"
"Documentation" = "https://gitlab.com/demsking/oremi-ohunerin-listener/-/blob/main/README.md"

[project.scripts]
oremi-ohunerin-listener = "ohunerin:main"

[dependency-groups]
dev = [
  "aiohttp>=3.9.0",
  "autopep8>=2.3.2",
  "bandit>=1.8.3",
  "classify-imports>=4.2.0",
  "pylint>=3.3.7",
  "pyroma>=4.2",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.1",
  "python-dotenv>=1.1.0",
  "python-slugify>=8.0.4",
  "reorder-python-imports>=3.14.0",
  "sounddevice>=0.5.5",
  "twine>=6.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ohunerin"]

[tool.hatch.build]
ignore-vcs = true

[tool.pytest.ini_options]
# Function starting with the following pattern are considered for test cases.
python_functions = "test_"
