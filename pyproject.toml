[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "oremi-ohunerin-mqtt"
version = "1.0.0"
description = "Oremi Ohunerin MQTT bridges Oremi Ohunerin's real-time audio detection with MQTT, enabling seamless integration into home automation systems like Home Assistant"
keywords = ["sound", "detection", "wakeword", "mqtt"]
authors = ["Sébastien Demanou <demsking@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://gitlab.com/demsking/oremi-ohunerin-mqtt"
documentation = "https://gitlab.com/demsking/oremi-ohunerin-mqtt/-/blob/main/README.md"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: French",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.11"
]

include = []
exclude = []

packages = [
  { include = "ohunerin" },
]

[tool.poetry.scripts]
oremi-ohunerin-mqtt = 'ohunerin:main'

[tool.poetry.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Source" = "https://gitlab.com/demsking/oremi-ohunerin-mqtt"
"Tracker" = "https://gitlab.com/demsking/oremi-ohunerin-mqtt/-/issues"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
oremi-core = "^1.2.1"
websockets = "^14.1"
sounddevice = "^0.5.1"
paho-mqtt = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
pytest-cov = "^4.0.0"
pluggy = "^1.0.0"
pytest-asyncio = "^0.21.0"
pylint = {extras = ["spelling"], version = "^2.17.4"}

[tool.pytest.ini_options]
# Function starting with the following pattern are considered for test cases.
python_functions = "test_"
